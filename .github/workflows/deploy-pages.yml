name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned to match what's actually been built and tested locally all
      # along — "stable channel" on a GitHub-hosted runner can resolve to
      # an older release than this, and the project's fl_chart dependency
      # (and possibly other recent additions) may need this SDK version's
      # dependency resolution to succeed.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      # The customer app needs a real MapTiler key and Supabase project
      # to boot at all (see lib/bootstrap.dart's own startup guard) —
      # supplied as repo secrets rather than the gitignored local
      # dart_defines.json, which never leaves this machine.
      - name: Write dart_defines.json from secrets
        run: |
          cat > dart_defines.json <<EOF
          {
            "MAPTILER_API_KEY": "${{ secrets.MAPTILER_API_KEY }}",
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF
          cat > shop/dart_defines.json <<EOF
          {
            "SUPABASE_URL": "${{ secrets.SUPABASE_URL }}",
            "SUPABASE_ANON_KEY": "${{ secrets.SUPABASE_ANON_KEY }}"
          }
          EOF

      - name: Build customer app (site root)
        run: |
          flutter pub get
          # *.g.dart / *.freezed.dart (Riverpod providers, json_serializable
          # fromJson/toJson) are gitignored — they exist locally only
          # because build_runner has been run on this machine before.
          # A clean CI checkout has none of them, which is the actual
          # cause of every prior failure here ("Method not found:
          # _$RefundSlaDtoFromJson", "getter 'xProvider' isn't defined",
          # etc.) — nothing to do with memory or wasm, that was chasing
          # the wrong signal from a build failure with no visible error
          # text until -v + --no-wasm-dry-run finally surfaced it.
          dart run build_runner build --delete-conflicting-outputs
          # --no-wasm-dry-run skips an extra, unneeded dart2wasm
          # compatibility compile — every local build has needed only the
          # real JS compile, this dry run is dead weight for a target we
          # aren't shipping wasm for anyway, and a good place for a
          # Linux-only dart2wasm issue to hide behind the generic
          # "Failed to compile" wrapper error every CI run has shown so
          # far (14G free RAM+swap at failure ruled out memory).
          # Full output goes to a file so the tail can self-print on
          # failure without needing another manual round-trip.
          set +e
          flutter build web --release --no-wasm-dry-run -v \
            --base-href /Too-good-to-Leave/ \
            --dart-define-from-file=dart_defines.json 2>&1 | tee build_customer.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::group::Last 150 lines of build_customer.log"
            tail -150 build_customer.log
            echo "::endgroup::"
          fi
          exit $BUILD_EXIT

      - name: Build shop app (/shop/ subpath)
        working-directory: shop
        run: |
          flutter pub get
          set +e
          flutter build web --release --no-wasm-dry-run -v \
            --base-href /Too-good-to-Leave/shop/ \
            --dart-define-from-file=dart_defines.json 2>&1 | tee build_shop.log
          BUILD_EXIT=${PIPESTATUS[0]}
          set -e
          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "::group::Last 150 lines of build_shop.log"
            tail -150 build_shop.log
            echo "::endgroup::"
          fi
          exit $BUILD_EXIT

      # Combine both builds into one site: customer app at the root, shop
      # app under /shop/ — two independently-routed Flutter web apps
      # served from the one Pages deployment.
      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp -r build/web/. _site/
          mkdir -p _site/shop
          cp -r shop/build/web/. _site/shop/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
