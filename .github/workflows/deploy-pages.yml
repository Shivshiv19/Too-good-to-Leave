name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # dart2js is memory-hungry, and GitHub-hosted runners are RAM-
      # constrained enough that a release web build can get silently
      # OOM-killed mid-compile ("Compiling... 45.6s" then exit code 1,
      # with the actual dart2js error never printed — that's the OOM
      # signature, not a real compile error). Swap gives it headroom.
      # `/swapfile` already exists and is active on the runner image
      # itself ("Text file busy" fallocate-ing over live swap) — add a
      # second one at a different path instead of colliding with it.
      - name: Add swap space
        run: |
          free -h
          sudo fallocate -l 6G /swapfile-ci
          sudo chmod 600 /swapfile-ci
          sudo mkswap /swapfile-ci
          sudo swapon /swapfile-ci
          free -h

      # Pinned to match what's actually been built and tested locally all
      # along — "stable channel" on a GitHub-hosted runner can resolve to
      # an older release than this, and the project's fl_chart dependency
      # (and possibly other recent additions) may need this SDK version's
      # dependency resolution to succeed.
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.8

      # The customer app needs a real MapTiler key to boot at all (see
      # lib/bootstrap.dart's own startup guard) — supplied as a repo
      # secret rather than the gitignored local dart_defines.json, which
      # never leaves this machine.
      - name: Write dart_defines.json from secret
        run: |
          cat > dart_defines.json <<EOF
          { "MAPTILER_API_KEY": "${{ secrets.MAPTILER_API_KEY }}" }
          EOF

      - name: Build customer app (site root)
        run: |
          flutter pub get
          free -h
          flutter build web --release -v --base-href /Too-good-to-Leave/ \
            --dart-define-from-file=dart_defines.json

      - name: Build shop app (/shop/ subpath)
        working-directory: shop
        run: |
          flutter pub get
          flutter build web --release --base-href /Too-good-to-Leave/shop/

      # Combine both builds into one site: customer app at the root, shop
      # app under /shop/ — two independently-routed Flutter web apps
      # served from the one Pages deployment.
      - name: Assemble combined site
        run: |
          mkdir -p _site
          cp -r build/web/. _site/
          mkdir -p _site/shop
          cp -r shop/build/web/. _site/shop/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
